[package]
name = "publicator"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
jsonschema = "0.29"
openssl = "0.10"
pcre2 = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
chrono = "0.4"
