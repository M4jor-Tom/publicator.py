[package]
name = "publicator"
version = "0.1.0"
edition = "2024"

[features]
default = []
desktop = ["dep:iced", "dep:image", "iced/image-without-codecs", "tokio/rt-multi-thread"]
gpu = ["desktop", "iced/wgpu"]

[[bin]]
name = "publicator-ui"
path = "src/bin/publicator-ui.rs"
required-features = ["desktop"]

[[test]]
name = "ui_drafts"
path = "tests/ui_drafts.rs"
required-features = ["desktop"]

[[test]]
name = "ui_workflow"
path = "tests/ui_workflow.rs"
required-features = ["desktop"]

[[example]]
name = "ui_acceptance"
path = "examples/ui_acceptance.rs"
required-features = ["desktop"]

[dependencies]
iced = { version = "=0.14.0", optional = true, default-features = false, features = ["tiny-skia", "x11", "wayland", "tokio", "image-without-codecs"] }
image = { version = "=0.25.10", optional = true, default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
jsonschema = "0.29"
openssl = "0.10"
pcre2 = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["time", "process", "io-util", "macros", "rt"] }
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
iced_runtime = "=0.14.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
